<div class="dialog-frame translate-column-dialog" style="min-width: 600px;">
  <div class="dialog-border">
    <div class="dialog-header" bind="dialogHeader"></div>
    <form bind="form">
    <div class="dialog-body" bind="dialogBody">
      <div class="grid-layout layout-normal layout-full"><table role="presentation" cols="2" style="width: 600px;">
        <tr>
          <td width="1%" style="white-space: pre;"><label for="$translate-column-source" bind="or_views_sourceLang"></label></td>
          <td><select bind="sourceLangSelect" id="$translate-column-source"></select></td>
        </tr>
        <tr>
          <td width="1%" style="white-space: pre;"><label for="$translate-column-target" bind="or_views_targetLang"></label></td>
          <td><select bind="targetLangSelect" id="$translate-column-target"></select></td>
        </tr>
        <tr>
          <td></td>
          <td><div class="translate-column-warning" bind="languageWarning" style="display: none;"></div></td>
        </tr>
        <tr>
          <td width="1%" style="white-space: pre;"><label for="$translate-column-name" bind="or_views_newCol"></label></td>
          <td><input bind="columnNameInput" type="text" id="$translate-column-name" size="40" /></td>
        </tr>
        <tr>
          <td></td>
          <td><div class="translate-column-warning" bind="nameWarning" style="display: none;"></div></td>
        </tr>
        <tr>
          <td width="1%" style="white-space: pre;" bind="or_views_onErr"></td>
          <td>
            <input type="radio" name="translate-column-onerror-choice" value="set-to-blank" checked id="$translate-column-error-set-to-blank" />
              <label for="$translate-column-error-set-to-blank" bind="or_views_setBlank"></label>
            <input type="radio" name="translate-column-onerror-choice" value="store-error" id="$translate-column-error-store-error" />
              <label for="$translate-column-error-store-error" bind="or_views_storeErr"></label>
            <input type="radio" name="translate-column-onerror-choice" value="keep-original" id="$translate-column-error-keep-original" />
              <label for="$translate-column-error-keep-original" bind="or_views_copyVal"></label></td>
        </tr>
      </table></div>
      <div class="translate-column-error" bind="requestError" role="alert" style="display: none;"></div>
    </div>
    <div class="dialog-footer" bind="dialogFooter">
      <button class="button button-primary" type="submit" bind="okButton"></button>
      <button class="button" type="button" bind="cancelButton"></button>
    </div>
    </form>
  </div>
</div>
